name: Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag.yml"
    branches:
      - main

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== vswhere ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productLineVersion
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "=== available VC toolsets ==="
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "=== cmake version ==="
          cmake --version
          Write-Host "=== generators ==="
          cmake --help | Select-String "Visual Studio"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Try configure (capture logs)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T v142 . *> configure-v142.log
          Write-Host "v142 exit: $LASTEXITCODE"
          cmake -B build2 -G "Visual Studio 17 2022" -A x64 . *> configure-default.log
          Write-Host "default exit: $LASTEXITCODE"
          Get-Content configure-v142.log | Select-Object -Last 30
          Write-Host "=== default toolset log ==="
          Get-Content configure-default.log | Select-Object -Last 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            configure-v142.log
            configure-default.log
