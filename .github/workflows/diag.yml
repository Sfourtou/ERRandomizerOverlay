name: Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag.yml"
    branches:
      - main

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Try configure (report to job summary)
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T v142 . *> configure-v142.log
          $code = $LASTEXITCODE
          "## configure exit: $code" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content configure-v142.log | ForEach-Object { $_ } | Out-File -Append $env:GITHUB_STEP_SUMMARY
          exit 0
