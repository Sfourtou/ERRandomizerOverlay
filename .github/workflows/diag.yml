name: Diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== vswhere ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productLineVersion
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "=== available VC toolsets ==="
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "=== cmake version ==="
          cmake --version
          Write-Host "=== generators ==="
          cmake --help | Select-String "Visual Studio"
      - name: Try configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cmake -B build -G "Visual Studio 17 2022" -A x64 -T v142 .
          Write-Host "exit: $LASTEXITCODE"
          cmake -B build2 -G "Visual Studio 17 2022" -A x64 .
          Write-Host "exit: $LASTEXITCODE"
