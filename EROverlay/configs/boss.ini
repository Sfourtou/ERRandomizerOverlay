# Boss overlay settings.
# Save as UTF-8 and restart the game after editing.
# Put comments on separate lines starting with # or ;.
# Chinese-comment templates: copy the matching file from configs_CN/ to configs/.

# Display and interaction
# Switch between the compact status line and the full, expandable boss list.
# Use a key such as F8 or CTRL+M; see input.ini for key names.
# The line below assigns '=': the first '=' separates the setting name from its value.
# Use NONE to disable this shortcut. An empty value restores the default '=' key.
toggle_full_mode==

# Boss data filename under data/<language>/; the language is set in common.ini.
data_file=bosses.json

# true: revive a defeated boss by clicking its checked box in the full list.
# Resets its primary flag and all revive_flags in data/<language>/bosses.json.
# Numeric entries clear to 0; {"flag_id": ID, "value": true} restores a flag to 1.
# A confirmation popup appears before any flags change; missing flags abort the reset.
# Travel or reload the area afterwards so the game recreates characters and arena assets.
# Radahn/Redmane share festival state; reviving Patches rewinds his quest location/surrender.
# See docs/boss-revival.md for quest-linked entry behavior and static verification limits.
# false: do not allow this reset.
allow_revive=false

# Panel layout: x, y, width, height (four comma-separated values).
# Use pixel counts such as 10, or percentages such as 15% (horizontal: width; vertical: height).
# Fractions between 0 and 1 are screen ratios: 0.15 also means 15%, not 0.15 pixels.
# Use percentages below 100% in magnitude; 100% is interpreted as 1 pixel.
# Positive x/y measure from the left/top. Negative x/y anchor the panel's right/bottom edge.
# Width and height apply to the full list; 0 lets that dimension fit its content.
# The compact status line always fits its content, using the same position and anchor.
# Default: 10 pixels from the right and top, 15% of screen width, 90% of screen height.
panel_pos=-10,10,15%,90%

# Status text
# Text shown in normal mode. Keep placeholder names and braces unchanged.
#   {kills}: defeated bosses.   {total}: bosses in the loaded dataset.
#   {deaths}: deaths in the current save (deaths in the current attempt in challenge mode).
#   {igt}: in-game time, shown as MM:SS or HH:MM:SS.   $n: start a new line.
# Example: Defeated: {kills}/{total}$nDeaths: {deaths}
boss_kill_text={kills}/{total}

# Challenge mode
# true: show challenge_status_text and track a personal best within the death limit.
# After the limit is exceeded, the current boss count still updates but cannot improve the best.
# false: show boss_kill_text and use the normal save-wide death count.
challenge_mode=false

# Maximum deaths allowed per challenge attempt. Use a nonnegative integer.
# 0 allows no deaths; 1 allows one death. The next death counts as a failed attempt.
challenge_death_count=0

# Text shown while challenge_mode=true. The placeholders above also work here.
#   {pb}: highest boss count achieved within the death limit across attempts.
#   {tries}: number of failed attempts.
# Personal best and attempt totals are saved in Challenge.txt beside the loader.
# The default text shows the best and failed-attempt count, then the current boss count.
challenge_status_text=PB: {pb}/{total}  Tries: {tries}$nCurrent: {kills}/{total}

# Randomizer integration (Elden Ring Item and Enemy Randomizer)
# Path to a randomizer spoiler log (a *_log_*.txt file from the randomizer's
# spoiler_logs directory), or to that directory itself to always use its newest log.
# When left empty, a spoiler_logs folder beside the loader is used automatically if present.
# With a log loaded, the boss list shows the enemy the randomizer placed at each
# vanilla boss location, and tooltips show both the vanilla and placed names.
randomizer_spoiler_log=

# Path to the randomizer's diste/Base/enemy.txt data file. It maps enemy entity
# IDs to their defeat flags, which lets every placed boss be matched to its
# location (some bosses, e.g. festival Radahn or Night's Cavalry, have entity IDs
# that differ from their defeat flags). When left empty, a diste folder beside the
# loader is used automatically if present. Without this file, most bosses still
# match but a few (about a dozen) may not be identified.
randomizer_enemy_data=

# true: show a "Boss defeated: ..." toast in-game when a boss dies.
randomizer_notifications=true

# When to display the placed boss's name in the boss list:
#   on_kill (default): the location shows its vanilla boss until the boss is
#     defeated, then the placed enemy's name is revealed. Avoids spoilers.
#   always: the placed enemy's name is always shown.
randomizer_reveal=on_kill

# true (default): add a "Remaining pool" collapsible section to the full list.
# It groups the bosses that are still alive by placed enemy identity (from the
# spoiler log, without revealing their locations), so you can see what is left
# to kill, e.g. "Malenia, Blade of Miquella (x2 remaining of 3 in run)" when the
# randomizer placed several copies. Bosses missing from the log are grouped by
# their vanilla name instead.
randomizer_pool=true

# true: add a "Hide defeated" checkbox above the boss list to show only the
# bosses that are still alive. The region list also hides fully defeated regions.
randomizer_pool_filter=false
